<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Leno Sushi MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
        <h1 class="text-2xl font-bold mb-4">Leno Sushi</h1>
        <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="5bca5ef0-c823-455a-94a2-9a5de6c6ea88">
            <div class="mb-4">
                <label>Sushi Box ($20)</label>
                <input type="number" name="quantity" value="1" class="border p-1 w-full">
            </div>
            <div class="mb-4">
                <label>Delivery Date</label>
                <input type="date" name="date" required class="border p-1 w-full">
            </div>
            <button type="submit" class="bg-black text-white px-4 py-2 w-full">Request Order</button>
        </form>
    </div>
</body>
</html>
